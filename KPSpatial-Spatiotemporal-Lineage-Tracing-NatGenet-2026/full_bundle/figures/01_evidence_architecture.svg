<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="560" viewBox="0 0 1160 560" role="img"><title>历史、状态和空间：三种观测，不是三个同义词</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#526678"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Noto Sans CJK SC, sans-serif" fill="#172f49"><text x="40" y="48" font-size="25" font-weight="700">历史、状态和空间：三种观测，不是三个同义词</text><text x="40" y="78" font-size="14" fill="#526678">本次研究逻辑示意；不是论文原图；箭头表示分析依赖，不表示已证实因果。</text><rect x="40" y="115" width="320" height="115" rx="12" fill="#f0f5f8" stroke="#9caeba"/><rect x="40" y="115" width="320" height="5" rx="2" fill="#267f87"/><text x="200.0" y="147" font-size="20" fill="#267f87" text-anchor="middle" font-weight="700">谱系记录</text><text x="200.0" y="180" font-size="16" fill="#172f49" text-anchor="middle" font-weight="normal">编辑状态与缺失</text><text x="200.0" y="205" font-size="16" fill="#172f49" text-anchor="middle" font-weight="normal">亲缘证据</text><rect x="420" y="115" width="320" height="115" rx="12" fill="#f0f5f8" stroke="#9caeba"/><rect x="420" y="115" width="320" height="5" rx="2" fill="#267f87"/><text x="580.0" y="147" font-size="20" fill="#267f87" text-anchor="middle" font-weight="700">转录表达</text><text x="580.0" y="180" font-size="16" fill="#172f49" text-anchor="middle" font-weight="normal">细胞类型 / 基因程序</text><text x="580.0" y="205" font-size="16" fill="#172f49" text-anchor="middle" font-weight="normal">当前状态</text><rect x="800" y="115" width="320" height="115" rx="12" fill="#f0f5f8" stroke="#9caeba"/><rect x="800" y="115" width="320" height="5" rx="2" fill="#267f87"/><text x="960.0" y="147" font-size="20" fill="#267f87" text-anchor="middle" font-weight="700">空间坐标</text><text x="960.0" y="180" font-size="16" fill="#172f49" text-anchor="middle" font-weight="normal">组织位置 / 局部组成</text><text x="960.0" y="205" font-size="16" fill="#172f49" text-anchor="middle" font-weight="normal">当前环境</text><rect x="40" y="282" width="320" height="115" rx="12" fill="#f0f5f8" stroke="#9caeba"/><rect x="40" y="282" width="320" height="5" rx="2" fill="#267f87"/><text x="200.0" y="314" font-size="20" fill="#267f87" text-anchor="middle" font-weight="700">谱系推断</text><text x="200.0" y="347" font-size="16" fill="#172f49" text-anchor="middle" font-weight="normal">树拓扑 + 枝长假设</text><text x="200.0" y="372" font-size="16" fill="#172f49" text-anchor="middle" font-weight="normal">fitness / 亲缘近邻</text><rect x="420" y="282" width="320" height="115" rx="12" fill="#f0f5f8" stroke="#9caeba"/><rect x="420" y="282" width="320" height="5" rx="2" fill="#267f87"/><text x="580.0" y="314" font-size="20" fill="#267f87" text-anchor="middle" font-weight="700">状态量化</text><text x="580.0" y="347" font-size="16" fill="#172f49" text-anchor="middle" font-weight="normal">细胞内表达与组成分开</text><text x="580.0" y="372" font-size="16" fill="#172f49" text-anchor="middle" font-weight="normal">community / plasticity</text><rect x="800" y="282" width="320" height="115" rx="12" fill="#f0f5f8" stroke="#9caeba"/><rect x="800" y="282" width="320" height="5" rx="2" fill="#267f87"/><text x="960.0" y="314" font-size="20" fill="#267f87" text-anchor="middle" font-weight="700">空间描述</text><text x="960.0" y="347" font-size="16" fill="#172f49" text-anchor="middle" font-weight="normal">邻域、边界和组织几何</text><text x="960.0" y="372" font-size="16" fill="#172f49" text-anchor="middle" font-weight="normal">距离与细胞配置</text><line x1="200" y1="232" x2="200" y2="276" stroke="#526678" stroke-width="2" marker-end="url(#arrow)"/><line x1="580" y1="232" x2="580" y2="276" stroke="#526678" stroke-width="2" marker-end="url(#arrow)"/><line x1="960" y1="232" x2="960" y2="276" stroke="#526678" stroke-width="2" marker-end="url(#arrow)"/><line x1="200" y1="403" x2="580" y2="455" stroke="#526678" stroke-width="2" marker-end="url(#arrow)"/><line x1="960" y1="403" x2="580" y2="455" stroke="#526678" stroke-width="2" marker-end="url(#arrow)"/><line x1="580" y1="403" x2="580" y2="455" stroke="#526678" stroke-width="2" marker-end="url(#arrow)"/><text x="580" y="490" font-size="23" fill="#172f49" text-anchor="middle" font-weight="700">联合证据 → 竞争解释的比较</text><text x="580" y="524" font-size="16" fill="#526678" text-anchor="middle" font-weight="normal">独立验证、扰动和统计单位决定结论上限；共定位本身不等于因果。</text></g></svg>