<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="510" viewBox="0 0 1160 510" role="img"><title>迁移到分期 Xenium：信息边界决定推断边界</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#526678"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Noto Sans CJK SC, sans-serif" fill="#172f49"><text x="40" y="48" font-size="25" font-weight="700">迁移到分期 Xenium：信息边界决定推断边界</text><text x="40" y="78" font-size="14" fill="#526678">本次迁移建议；本文核心平台不是 Xenium。</text><rect x="40" y="123" width="510" height="174" rx="12" fill="#f0f5f8" stroke="#9caeba"/><rect x="40" y="123" width="510" height="5" rx="2" fill="#267f87"/><text x="295.0" y="155" font-size="20" fill="#267f87" text-anchor="middle" font-weight="700">已有分期空间数据可回答</text><text x="295.0" y="188" font-size="16" fill="#172f49" text-anchor="middle" font-weight="normal">状态 / 组成 / 距边界 / 局部环境</text><text x="295.0" y="213" font-size="16" fill="#172f49" text-anchor="middle" font-weight="normal">跨独立动物比较阶段差异</text><text x="295.0" y="238" font-size="16" fill="#172f49" text-anchor="middle" font-weight="normal">寻找相似条件下的反例与交互作用</text><rect x="610" y="123" width="510" height="174" rx="12" fill="#f0f5f8" stroke="#9caeba"/><rect x="610" y="123" width="510" height="5" rx="2" fill="#a76b25"/><text x="865.0" y="155" font-size="20" fill="#a76b25" text-anchor="middle" font-weight="700">没有独立谱系证据时不能自动回答</text><text x="865.0" y="188" font-size="16" fill="#172f49" text-anchor="middle" font-weight="normal">真实祖先—后代分支</text><text x="865.0" y="213" font-size="16" fill="#172f49" text-anchor="middle" font-weight="normal">本文含义的树 fitness / clonal plasticity</text><text x="865.0" y="238" font-size="16" fill="#172f49" text-anchor="middle" font-weight="normal">转移 founder 的实际亲缘来源</text><text x="580" y="348" font-size="25" fill="#172f49" text-anchor="middle" font-weight="700">纯克隆起始 ≠ 测得后续分支树</text><text x="580" y="389" font-size="19" fill="#526678" text-anchor="middle" font-weight="normal">跨阶段快照 ≠ 追踪同一个细胞；空间连续性 ≠ 真实时间顺序。</text><text x="580" y="440" font-size="22" fill="#267f87" text-anchor="middle" font-weight="700">合理目标：可反驳的“状态与组织结构阶段演进模型”。</text></g></svg>