<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="620" viewBox="0 0 1160 620" role="img"><title>一个足以检出错误的四叶树</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#526678"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Noto Sans CJK SC, sans-serif" fill="#172f49"><text x="40" y="48" font-size="25" font-weight="700">一个足以检出错误的四叶树</text><text x="40" y="78" font-size="14" fill="#526678">实际执行了作者原函数；合成输入，不是论文原始数据。</text><line x1="260" y1="130" x2="160" y2="200" stroke="#526678" stroke-width="3"/><line x1="260" y1="130" x2="360" y2="200" stroke="#526678" stroke-width="3"/><line x1="160" y1="200" x2="110" y2="280" stroke="#526678" stroke-width="3"/><line x1="160" y1="200" x2="210" y2="280" stroke="#526678" stroke-width="3"/><line x1="360" y1="200" x2="310" y2="280" stroke="#526678" stroke-width="3"/><line x1="360" y1="200" x2="410" y2="280" stroke="#526678" stroke-width="3"/><circle cx="110" cy="280" r="23" fill="#267f87"/><text x="110" y="287" font-size="20" fill="white" text-anchor="middle" font-weight="700">a</text><text x="110" y="328" font-size="17" fill="#267f87" text-anchor="middle" font-weight="normal">标签 A</text><circle cx="210" cy="280" r="23" fill="#267f87"/><text x="210" y="287" font-size="20" fill="white" text-anchor="middle" font-weight="700">b</text><text x="210" y="328" font-size="17" fill="#267f87" text-anchor="middle" font-weight="normal">标签 A</text><circle cx="310" cy="280" r="23" fill="#a76b25"/><text x="310" y="287" font-size="20" fill="white" text-anchor="middle" font-weight="700">c</text><text x="310" y="328" font-size="17" fill="#a76b25" text-anchor="middle" font-weight="normal">标签 B</text><circle cx="410" cy="280" r="23" fill="#a76b25"/><text x="410" y="287" font-size="20" fill="white" text-anchor="middle" font-weight="700">d</text><text x="410" y="328" font-size="17" fill="#a76b25" text-anchor="middle" font-weight="normal">标签 B</text><text x="260" y="380" font-size="23" fill="#172f49" text-anchor="middle" font-weight="700">观测近邻纯度 = 1</text><rect x="520" y="125" width="585" height="122" rx="12" fill="#f0f5f8" stroke="#9caeba"/><rect x="520" y="125" width="585" height="5" rx="2" fill="#267f87"/><text x="812.5" y="157" font-size="20" fill="#267f87" text-anchor="middle" font-weight="700">六种不同的平衡标签排列</text><text x="812.5" y="190" font-size="16" fill="#172f49" text-anchor="middle" font-weight="normal">2 种纯度 = 1；4 种纯度 = 0</text><text x="812.5" y="215" font-size="16" fill="#172f49" text-anchor="middle" font-weight="normal">精确上尾必须包含与观测相同的并列值</text><rect x="520" y="274" width="278" height="128" rx="12" fill="#f0f5f8" stroke="#9caeba"/><rect x="520" y="274" width="278" height="5" rx="2" fill="#a76b25"/><text x="659.0" y="306" font-size="20" fill="#a76b25" text-anchor="middle" font-weight="700">原代码</text><text x="659.0" y="339" font-size="16" fill="#172f49" text-anchor="middle" font-weight="normal">只数 Tperm &gt; Tobs</text><text x="659.0" y="364" font-size="16" fill="#172f49" text-anchor="middle" font-weight="normal">P = 0</text><rect x="823" y="274" width="282" height="128" rx="12" fill="#f0f5f8" stroke="#9caeba"/><rect x="823" y="274" width="282" height="5" rx="2" fill="#267f87"/><text x="964.0" y="306" font-size="20" fill="#267f87" text-anchor="middle" font-weight="700">完整枚举</text><text x="964.0" y="339" font-size="16" fill="#172f49" text-anchor="middle" font-weight="normal">数 Tperm ≥ Tobs</text><text x="964.0" y="364" font-size="16" fill="#172f49" text-anchor="middle" font-weight="normal">P = 2/6 = 1/3</text><text x="580" y="463" font-size="22" fill="#172f49" text-anchor="middle" font-weight="700">独立修正工具：9999 次置换，固定种子 → P = 0.3279</text><text x="580" y="505" font-size="18" fill="#526678" text-anchor="middle" font-weight="normal">同一缺陷也让无信息的星形树输出 P=0；正确结果为 P=1。</text><text x="580" y="552" font-size="17" fill="#526678" text-anchor="middle" font-weight="normal">能够确认：检验实现有缺陷。不能据此确认：论文每一行正确 P 值或主结论受影响多少。</text><text x="580" y="589" font-size="15" fill="#526678" text-anchor="middle" font-weight="normal">源文件 Git blob 已核对；测试代码和完整收据见工具包。</text></g></svg>