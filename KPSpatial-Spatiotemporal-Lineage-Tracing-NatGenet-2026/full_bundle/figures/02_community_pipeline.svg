<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="570" viewBox="0 0 1160 570" role="img"><title>本文的 spatial community 是空间基因程序</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#526678"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Noto Sans CJK SC, sans-serif" fill="#172f49"><text x="40" y="48" font-size="25" font-weight="700">本文的 spatial community 是空间基因程序</text><text x="40" y="78" font-size="14" fill="#526678">依据 Reporting Summary 与已读打分脚本整理；不是 cell-type composition 聚类。</text><rect x="40" y="120" width="300" height="130" rx="12" fill="#f0f5f8" stroke="#9caeba"/><rect x="40" y="120" width="300" height="5" rx="2" fill="#267f87"/><text x="190.0" y="152" font-size="20" fill="#267f87" text-anchor="middle" font-weight="700">每个样本</text><text x="190.0" y="185" font-size="16" fill="#172f49" text-anchor="middle" font-weight="normal">表达 + 空间坐标</text><text x="190.0" y="210" font-size="16" fill="#172f49" text-anchor="middle" font-weight="normal">保留平台 / 样本信息</text><rect x="430" y="120" width="300" height="130" rx="12" fill="#f0f5f8" stroke="#9caeba"/><rect x="430" y="120" width="300" height="5" rx="2" fill="#267f87"/><text x="580.0" y="152" font-size="20" fill="#267f87" text-anchor="middle" font-weight="700">Hotspot</text><text x="580.0" y="185" font-size="16" fill="#172f49" text-anchor="middle" font-weight="normal">20 邻居；基因 FDR 0.01</text><text x="580.0" y="210" font-size="16" fill="#172f49" text-anchor="middle" font-weight="normal">局部模块 ≥50 基因</text><rect x="820" y="120" width="300" height="130" rx="12" fill="#f0f5f8" stroke="#9caeba"/><rect x="820" y="120" width="300" height="5" rx="2" fill="#267f87"/><text x="970.0" y="152" font-size="20" fill="#267f87" text-anchor="middle" font-weight="700">跨样本共识</text><text x="970.0" y="185" font-size="16" fill="#172f49" text-anchor="middle" font-weight="normal">模块 Jaccard 表示</text><text x="970.0" y="210" font-size="16" fill="#172f49" text-anchor="middle" font-weight="normal">标准化 + Ward → 11 组</text><line x1="345" y1="185" x2="420" y2="185" stroke="#526678" stroke-width="2" marker-end="url(#arrow)"/><line x1="735" y1="185" x2="810" y2="185" stroke="#526678" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="320" width="300" height="130" rx="12" fill="#f0f5f8" stroke="#9caeba"/><rect x="40" y="320" width="300" height="5" rx="2" fill="#a76b25"/><text x="190.0" y="352" font-size="20" fill="#a76b25" text-anchor="middle" font-weight="700">共识基因集合</text><text x="190.0" y="385" font-size="16" fill="#172f49" text-anchor="middle" font-weight="normal">方法：至少四分之一模块</text><text x="190.0" y="410" font-size="16" fill="#172f49" text-anchor="middle" font-weight="normal">代码：严格大于 floor(25%×M)</text><rect x="430" y="320" width="300" height="130" rx="12" fill="#f0f5f8" stroke="#9caeba"/><rect x="430" y="320" width="300" height="5" rx="2" fill="#267f87"/><text x="580.0" y="352" font-size="20" fill="#267f87" text-anchor="middle" font-weight="700">逐 spot 打分</text><text x="580.0" y="385" font-size="16" fill="#172f49" text-anchor="middle" font-weight="normal">score_genes</text><text x="580.0" y="410" font-size="16" fill="#172f49" text-anchor="middle" font-weight="normal">ctrl_size=100；n_bins=30</text><rect x="820" y="320" width="300" height="130" rx="12" fill="#f0f5f8" stroke="#9caeba"/><rect x="820" y="320" width="300" height="5" rx="2" fill="#267f87"/><text x="970.0" y="352" font-size="20" fill="#267f87" text-anchor="middle" font-weight="700">保留完整输出</text><text x="970.0" y="385" font-size="16" fill="#172f49" text-anchor="middle" font-weight="normal">各社区连续分数</text><text x="970.0" y="410" font-size="16" fill="#172f49" text-anchor="middle" font-weight="normal">argmax 标签只是摘要</text><line x1="970" y1="255" x2="970" y2="285" stroke="#526678" stroke-width="2" marker-end="url(#arrow)"/><line x1="970" y1="285" x2="190" y2="285" stroke="#526678" stroke-width="2" marker-end="url(#arrow)"/><line x1="190" y1="285" x2="190" y2="312" stroke="#526678" stroke-width="2" marker-end="url(#arrow)"/><line x1="345" y1="385" x2="420" y2="385" stroke="#526678" stroke-width="2" marker-end="url(#arrow)"/><line x1="735" y1="385" x2="810" y2="385" stroke="#526678" stroke-width="2" marker-end="url(#arrow)"/><text x="580" y="506" font-size="21" fill="#172f49" text-anchor="middle" font-weight="700">社区分数变化 = 状态变化？细胞组成变化？两者需要区分。</text><text x="580" y="540" font-size="15" fill="#526678" text-anchor="middle" font-weight="normal">未取得完整共识发现 notebook；Jaccard 0.2 的伙伴数逻辑仍待代码确认。</text></g></svg>